[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wismo-chat-assistant"
version = "0.1.0"
description = "Multi-tenant WISMO support assistant for D2C brands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "phonenumbers>=8.13.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "services", "repositories", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
